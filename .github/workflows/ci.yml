name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Build the Docker image
        run: docker build -t my-website:${{ github.sha }} .

      - name: Start the container
        run: docker run -d -p 8080:80 --name mysite my-website:${{ github.sha }}

      - name: Test the home page
        run: |
          sleep 3
          curl -sf http://localhost:8080 -o page.html
          cat page.html
          grep -q "My first Docker image" page.html